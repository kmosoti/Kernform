[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "kernform"
version = "0.1.0"
description = "Deterministic project lifecycle initializer for Python and Rust projects."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kennedy Mosoti" }]
dependencies = []

[project.scripts]
kernform = "kernform.cli:main"

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "maturin==1.14.1",
  "pyright==1.1.411",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.15.16",
]

[tool.maturin]
manifest-path = "crates/kernform-python/Cargo.toml"
module-name = "kernform._native"
python-source = "python"
features = ["pyo3/extension-module"]
include = [{ path = "capabilities/**/*", format = "sdist" }]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["python", "tests"]
exclude = ["reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "fast: ordinary deterministic development checks",
  "full: installability, generation, integration, and container checks",
  "deep: long-running property, stress, audit, or mutation checks",
  "container: rootless Podman profile-matrix checks",
]
