schema = "kernform.toolchains/v1"
catalog_id = "{{ catalog_id }}"
catalog_hash = "{{ catalog_hash }}"
resolved_at = "{{ catalog_resolved_at }}"
source = "{{ catalog_source }}"

[tools]
granian = "{{ version_granian }}"
jsonschema = "{{ version_jsonschema }}"
litestar = "{{ version_litestar }}"
maturin = "{{ version_maturin }}"
msgspec = "{{ version_msgspec }}"
proptest = "{{ version_proptest }}"
pyo3 = "{{ version_pyo3 }}"
pyright = "{{ version_pyright }}"
pytest = "{{ version_pytest }}"
pytest-cov = "{{ version_pytest_cov }}"
python = "{{ version_python }}"
ruff = "{{ version_ruff }}"
rust = "{{ version_rust }}"
semver = "{{ version_semver }}"
serde = "{{ version_serde }}"
serde_json = "{{ version_serde_json }}"
sha2 = "{{ version_sha2 }}"
tempfile = "{{ version_tempfile }}"
thiserror = "{{ version_thiserror }}"
toml = "{{ version_toml }}"
uv = "{{ version_uv }}"
wait-timeout = "{{ version_wait_timeout }}"

[images]
python-slim-linux-amd64 = "{{ python_image_digest }}"
rust-slim-linux-amd64 = "{{ rust_image_digest }}"
