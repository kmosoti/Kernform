schema = "kernform.project-form/v2"
generator_version = "0.2.0"

[project]
name = "{{ project_name }}"
requested_signatures = [{{ requested_signature_list }}]
resolved_signatures = [{{ resolved_signature_list }}]
capabilities = [{{ capability_list }}]

[runtime]
{{ runtime_default_line }}

[git]
enabled = {{ git_enabled }}
initial_branch = "main"
initial_commit = false
create_remote = false

[versions]
policy = "newest-stable-exact"
allow_prerelease = false
catalog_id = "{{ catalog_id }}"
catalog_hash = "{{ catalog_hash }}"

[web]
javascript = "none"

[containers]
engine = "podman"
rootless = true
