[build-system]
requires = ["maturin=={{ maturin_version }}"]
build-backend = "maturin"

[project]
name = "{{ project_name }}"
version = "0.1.0"
requires-python = ">={{ python_minimum }}"
dependencies = [
]

[dependency-groups]
dev = [
  "pyright=={{ pyright_version }}",
  "pytest=={{ pytest_version }}",
  "ruff=={{ ruff_version }}",
]

[tool.maturin]
manifest-path = "crates/{{ project_name }}-python/Cargo.toml"
module-name = "{{ module_name }}._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["python", "tests"]
