[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "example-library"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==9.0.3",
  "ruff==0.15.16",
]

[tool.maturin]
manifest-path = "crates/example-library-python/Cargo.toml"
module-name = "example_library._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["python", "tests"]
