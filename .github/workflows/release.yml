name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable MAJOR.MINOR.PATCH version
        required: true
        type: string
      source_commit:
        description: Full verified source commit
        required: true
        type: string
      publish:
        description: Promote the verified bundle to an existing matching tag
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.source_commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-once:
    runs-on: [self-hosted, linux, x64, kernform-release]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out requested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Synchronize exact Python environment
        run: uv sync --all-groups --frozen
      - name: Run maintained full tier once
        run: |
          mkdir -p target/reports
          uv run kernform --agent test full > target/reports/full.json
      - name: Export the already-tested runtime image
        env:
          KERNFORM_RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          uv run python -m kernform.release_artifacts export-oci
          --version "$KERNFORM_RELEASE_VERSION"
          --output-directory target/kernform-test/wheels
      - name: Build immutable release bundle
        env:
          KERNFORM_RELEASE_VERSION: ${{ inputs.version }}
          KERNFORM_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: >-
          uv run python -m kernform.release_artifacts build
          --version "$KERNFORM_RELEASE_VERSION"
          --source-commit "$KERNFORM_SOURCE_COMMIT"
          --wheel-directory target/kernform-test/wheels
          --output-directory target/release
      - name: Upload verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernform-release-${{ inputs.source_commit }}
          path: |
            target/release/kernform-${{ inputs.version }}.zip
            target/reports/full.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest the exact bundle
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/release/kernform-${{ inputs.version }}.zip

  publish-existing-tag:
    if: inputs.publish
    needs: build-once
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download byte-identical candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernform-release-${{ inputs.source_commit }}
          path: target/candidate
      - name: Publish only from an existing verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          KERNFORM_RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v${KERNFORM_RELEASE_VERSION}"
          "target/candidate/release/kernform-${KERNFORM_RELEASE_VERSION}.zip"
          --verify-tag
          --title "Kernform ${KERNFORM_RELEASE_VERSION}"
          --generate-notes
