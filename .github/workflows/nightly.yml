name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deep-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Synchronize exact Python environment
        run: uv sync --all-groups --frozen
      - name: Run maintained deep tier
        run: |
          mkdir -p target/reports
          uv run kernform --agent test deep > target/reports/deep.json
      - name: Retain machine report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernform-deep-${{ github.sha }}
          path: target/reports/deep.json
          if-no-files-found: error
          retention-days: 14
